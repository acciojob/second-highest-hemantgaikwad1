<!DOCTYPE html>

<body>	
	 <h3>Find Second Highest</h3>
    <label for="numbers">Enter numbers (space separated):</label>
    <input type="text" id="numbers" />
    <button onclick="Main()">Submit</button>

    <p id="result"></p>
	<script>
		function secondHighest(arr) {
			//Write your code here
			
			if(arr.length<2){
				return Number.NEGATIVE_INFINITY;
			}

if (arr.every(val => val === arr[0])) {
    return Number.NEGATIVE_INFINITY;
}


			
			let max=arr[0];
			let secondMax=arr[0];
			for(let i=1;i<arr.length;i++){
				if(arr[i]>max){
					secondMax=max;
					max=arr[i];
					
				}
				else if(max>arr[i] && secondMax<arr[i]){
					secondMax=arr[i];
				}
			}
			
			return secondMax;
		}

		 function Main() {
            
            let input = document.getElementById("numbers").value;
            let arr = input.trim().split(/\s+/).map(Number);


            document.getElementById("result").innerText = "Second highest: " + secondHighest(arr);
        }
		
		
	</script>


</script>

</body>

</html>
